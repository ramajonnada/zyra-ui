<div [class]="hostClass()">
    <div
        class="zyr-file-upload__dropzone"
        role="button"
        tabindex="0"
        [attr.aria-disabled]="isDisabled() || null"
        [attr.aria-labelledby]="resolvedId() + '-label'"
        (click)="openPicker()"
        (keydown.enter)="openPicker()"
        (keydown.space)="openPicker()"
        (dragover)="onDragOver($event)"
        (dragleave)="onDragLeave($event)"
        (drop)="onDrop($event)"
    >
        <input
            #fileInput
            class="zyr-file-upload__native-input"
            type="file"
            [id]="resolvedId()"
            [multiple]="multiple()"
            [accept]="accept()"
            [disabled]="isDisabled()"
            tabindex="-1"
            (change)="onFileInputChange($event)"
        />

        <zyra-icon class="zyr-file-upload__icon" [img]="icons.boxOpen" [size]="28" />
        <p class="zyr-file-upload__label" [id]="resolvedId() + '-label'">
            <span class="zyr-file-upload__label-strong">Click to upload</span> or drag and drop
        </p>
        <ng-content />
    </div>

    @if (files().length > 0) {
        <ul class="zyr-file-upload__list">
            @for (file of files(); track file.name + file.size; let i = $index) {
                <li class="zyr-file-upload__item">
                    <span class="zyr-file-upload__item-name">{{ file.name }}</span>
                    <span class="zyr-file-upload__item-size">{{ formatSize(file.size) }}</span>
                    <button
                        type="button"
                        class="zyr-file-upload__item-remove"
                        [attr.aria-label]="'Remove ' + file.name"
                        [disabled]="isDisabled()"
                        (click)="removeFile(i)"
                    >
                        <zyra-icon [img]="icons.xmark" [size]="14" />
                    </button>
                </li>
            }
        </ul>
    }
</div>
