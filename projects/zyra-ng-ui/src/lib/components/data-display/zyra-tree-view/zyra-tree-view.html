<div
    [class]="hostClass()"
    role="tree"
    [attr.aria-multiselectable]="selectionMode() === 'multiple' ? true : null"
    [attr.aria-disabled]="disabled()"
>
    @for (flat of visibleNodes(); track flat.node.id) {
        <!-- Keyboard handling lives on the host's own @HostListener('keydown')
             in zyra-tree-view.ts (arrow keys, Enter/Space) rather than
             inline here — the template linter can't see across that
             boundary, hence the disable below. -->
        <!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events -->
        <div
            [id]="rowDomId(flat.node.id)"
            class="zyr-tree__row"
            role="treeitem"
            [style.paddingLeft.px]="flat.depth * 20 + 8"
            [attr.aria-expanded]="flat.hasChildren ? isExpanded(flat.node.id) : null"
            [attr.aria-selected]="selectionMode() !== 'none' ? isSelected(flat.node.id) : null"
            [attr.aria-level]="flat.depth + 1"
            [attr.aria-disabled]="flat.node.disabled ? true : null"
            [tabindex]="isFocused(flat.node.id) ? 0 : -1"
            [class.zyr-tree__row--selected]="isSelected(flat.node.id)"
            [class.zyr-tree__row--disabled]="flat.node.disabled"
            (click)="onRowClick(flat)"
            (focus)="onRowFocus(flat.node.id)"
        >
            @if (flat.hasChildren) {
                <button
                    type="button"
                    class="zyr-tree__toggle"
                    tabindex="-1"
                    [disabled]="disabled() || flat.node.disabled"
                    [attr.aria-label]="isExpanded(flat.node.id) ? 'Collapse' : 'Expand'"
                    (click)="toggleExpand(flat.node); $event.stopPropagation()"
                >
                    <zyra-icon
                        class="zyr-tree__toggle-icon"
                        [class.zyr-tree__toggle-icon--expanded]="isExpanded(flat.node.id)"
                        [img]="icons.chevronDown"
                        [size]="14"
                    />
                </button>
            } @else {
                <span class="zyr-tree__toggle-spacer"></span>
            }

            @if (selectionMode() === 'multiple') {
                <!-- Wrapper only stops the click/keydown from bubbling into
                     the row's own handlers — the real interactive control is
                     the checkbox inside it (tabbable="false" there, so it
                     doesn't add its own separate Tab stop on top of the
                     row's roving tabindex). -->
                <!-- eslint-disable-next-line @angular-eslint/template/interactive-supports-focus -->
                <span
                    class="zyr-tree__checkbox"
                    (click)="$event.stopPropagation()"
                    (keydown)="$event.stopPropagation()"
                >
                    <zyra-checkbox
                        [checked]="isSelected(flat.node.id)"
                        [disabled]="disabled() || (flat.node.disabled ?? false)"
                        [tabbable]="false"
                        [attr.aria-label]="'Select ' + flat.node.label"
                        (changed)="toggleSelect(flat.node)"
                    />
                </span>
            }

            @if (flat.node.icon) {
                <zyra-icon class="zyr-tree__node-icon" [img]="flat.node.icon" [size]="14" />
            }

            <span class="zyr-tree__label">{{ flat.node.label }}</span>
        </div>
    }
</div>
