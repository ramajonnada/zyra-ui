<div
    [class]="hostClass()"
    role="radiogroup"
    [attr.aria-label]="ariaLabel()"
    (mouseleave)="onLeave()"
    (keydown)="onKeydown($event)"
>
    @for (star of stars(); track star) {
        <button
            type="button"
            class="zyr-rating__star"
            [class.zyr-rating__star--filled]="isFilled(star)"
            role="radio"
            [attr.aria-checked]="star === value()"
            [attr.aria-label]="star + ' star(s)'"
            [disabled]="disabled() || null"
            (click)="select(star)"
            (mouseenter)="onHover(star)"
        >
            <svg viewBox="0 0 24 24" width="1em" height="1em" fill="currentColor" stroke="currentColor" stroke-width="1">
                <path
                    d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z"
                />
            </svg>
        </button>
    }
</div>
