<ng-template #content><ng-content /></ng-template>

@switch (tagName()) {
    @case ('h1') {
        <h1 [class]="hostClass()">
            <ng-container *ngTemplateOutlet="content" />
        </h1>
    }
    @case ('h2') {
        <h2 [class]="hostClass()">
            <ng-container *ngTemplateOutlet="content" />
        </h2>
    }
    @case ('h3') {
        <h3 [class]="hostClass()">
            <ng-container *ngTemplateOutlet="content" />
        </h3>
    }
    @case ('h4') {
        <h4 [class]="hostClass()">
            <ng-container *ngTemplateOutlet="content" />
        </h4>
    }
    @case ('h5') {
        <h5 [class]="hostClass()">
            <ng-container *ngTemplateOutlet="content" />
        </h5>
    }
    @case ('h6') {
        <h6 [class]="hostClass()">
            <ng-container *ngTemplateOutlet="content" />
        </h6>
    }
    @case ('span') {
        <span [class]="hostClass()">
            <ng-container *ngTemplateOutlet="content" />
        </span>
    }
    @case ('div') {
        <div [class]="hostClass()">
            <ng-container *ngTemplateOutlet="content" />
        </div>
    }
    @default {
        <p [class]="hostClass()">
            <ng-container *ngTemplateOutlet="content" />
        </p>
    }
}
