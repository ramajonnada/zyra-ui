@if (open()) {
    <div class="zyr-drawer" role="presentation" (click)="onBackdropClick($event)">
        <div
            #drawerPanel
            [class]="panelClass()"
            role="dialog"
            aria-modal="true"
            [attr.aria-label]="title() || 'Drawer'"
            tabindex="-1"
        >
            <!-- Header -->
            <div class="zyr-drawer__header">
                <h2 class="zyr-drawer__title">{{ title() }}</h2>
                @if (dismissible()) {
                    <button
                        class="zyr-drawer__close"
                        type="button"
                        aria-label="Close"
                        (click)="closeForced()"
                    >
                        <span aria-hidden="true">×</span>
                    </button>
                }
            </div>

            <!-- Body -->
            <div class="zyr-drawer__body">
                <ng-content />
            </div>

            <!-- Footer -->
            <div class="zyr-drawer__footer">
                <ng-content select="[slot=footer]" />
            </div>
        </div>
    </div>
}
