@if (mode() === 'toggle') {
    <button
        type="button"
        [class]="hostClass() + ' zyr-theme-switch__trigger'"
        [attr.aria-label]="ariaLabel()"
        [disabled]="disabled()"
        (click)="handleTriggerClick()"
    >
        <zyra-icon [img]="triggerIcon()" [size]="18" />
    </button>
} @else {
    <zyra-dropdown-menu #dropdown [class]="hostClass()" align="end">
        <button
            slot="trigger"
            type="button"
            class="zyr-theme-switch__trigger"
            [attr.aria-label]="ariaLabel()"
            [attr.aria-haspopup]="true"
            [disabled]="disabled()"
        >
            <zyra-icon [img]="triggerIcon()" [size]="18" />
        </button>

        <div class="zyr-theme-switch__panel" role="menu" [attr.aria-label]="ariaLabel()">
            @for (option of options; track option.value) {
                <button
                    type="button"
                    role="menuitemradio"
                    class="zyr-theme-switch__option"
                    [class.zyr-theme-switch__option--active]="currentTheme() === option.value"
                    [attr.aria-checked]="currentTheme() === option.value"
                    (click)="selectTheme(option.value); dropdown.closeMenu()"
                >
                    <span class="zyr-theme-switch__option-label">{{ option.label }}</span>
                    @if (currentTheme() === option.value) {
                        <zyra-icon [img]="checkIcon" [size]="14" />
                    }
                </button>
            }
        </div>
    </zyra-dropdown-menu>
}
