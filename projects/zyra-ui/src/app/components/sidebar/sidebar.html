<zyra-sidebar width="240px" navLabel="Docs navigation" (click)="onNavClick($event)">
	@for (item of navItems; track item.route) {
		@if (item.heading) {
			<zyra-sidebar-section [heading]="item.heading">
				<a
					zyra-sidebar-item
					[routerLink]="item.route"
					routerLinkActive="zyr-sidebar-item--active"
					[routerLinkActiveOptions]="{ exact: true }"
					ariaCurrentWhenActive="page"
					[attr.aria-label]="item.label"
				>
					{{ item.label }}
				</a>
			</zyra-sidebar-section>
		} @else {
			<a
				zyra-sidebar-item
				[routerLink]="item.route"
				routerLinkActive="zyr-sidebar-item--active"
				[routerLinkActiveOptions]="{ exact: true }"
				ariaCurrentWhenActive="page"
				[attr.aria-label]="item.label"
			>
				{{ item.label }}
			</a>
		}

		@if (item.children) {
			<div class="sidebar__children" role="group" [attr.aria-label]="item.label">
				@for (child of item.children; track child.route) {
					<a
						zyra-sidebar-item
						class="sidebar__child-item"
						[routerLink]="child.route"
						routerLinkActive="zyr-sidebar-item--active"
						[routerLinkActiveOptions]="{ exact: true }"
						ariaCurrentWhenActive="page"
						[attr.aria-label]="child.label"
					>
						{{ child.label }}
					</a>
				}
			</div>
		}
	}

	<div sidebar-footer class="sidebar__footer">
		<span class="sidebar__footer-text">Zyra<span>UI</span></span>
	</div>
</zyra-sidebar>
