<aside class="sidebar">
	<nav class="sidebar__nav" aria-label="Secondary">
		@for (item of navItems; track item.route) {
		<div class="sidebar__group">
			<a [routerLink]="item.route" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
				class="sidebar__item" [attr.aria-label]="item.label">
				<span class="sidebar__label">{{ item.label }}</span>
				@if (item.badge) {
				<span class="sidebar__badge">{{ item.badge }}</span>
				}
			</a>

			@if (item.children) {
			<div class="sidebar__children">
				@for (child of item.children; track child.route) {
				<a [routerLink]="child.route" routerLinkActive="active" class="sidebar__child">
					{{ child.label }}
				</a>
				}
			</div>
			}
		</div>
		}
	</nav>

	<div class="sidebar__footer">
		<span class="sidebar__footer-dot"></span>
		<span class="sidebar__footer-text">Zyra<span>UI</span></span>
	</div>
</aside>
