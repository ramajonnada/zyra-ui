<nav class="breadcrumb" aria-label="Breadcrumb">
    @if (backTo(); as back) {
        <a class="breadcrumb__back" [routerLink]="getPath(back.url)">Back to {{ back.label }}</a>
    } @else {
        <ol class="breadcrumb__list">
            @for (item of items(); track item.url; let last = $last) {
                <li class="breadcrumb__item">
                    @if (last) {
                        <span class="breadcrumb__current" aria-current="page">{{ item.label }}</span>
                    } @else {
                        <a class="breadcrumb__link" [routerLink]="getPath(item.url)">{{ item.label }}</a>
                        <span class="breadcrumb__sep" aria-hidden="true">/</span>
                    }
                </li>
            }
        </ol>
    }
</nav>
