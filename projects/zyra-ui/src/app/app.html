<!-- Mobile navigation lives inside app-header's mobile panel (see header.html),
	 reusing this same app-sidebar component. Desktop rendering below is a
	 separate instance, gated by CSS to >=900px, so only one is ever visible
	 or focusable at a given viewport width. -->

<div class="app-shell">

	<app-header [showSidebar]="showSidebar()" />

	<div class="app-body" [class.app-body--landing]="!showSidebar()">

		@if (showSidebar()) {

		<app-sidebar />

		}

		<app-main />

	</div>

	<app-footer />

</div>

<zyra-toast-container />
