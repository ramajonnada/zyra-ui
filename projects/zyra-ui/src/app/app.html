<div class="app-shell">
	<app-header
		[showSidebarToggle]="showSidebar()"
		[sidebarOpen]="sidebarOpen()"
		(sidebarToggle)="toggleSidebar()"
	></app-header>
	<div class="app-body" [class.app-body--landing]="!showSidebar()">
		@if (showSidebar()) {
		<div class="sidebar-backdrop" [class.is-visible]="sidebarOpen()" (click)="closeSidebar()"></div>
		<app-sidebar
			id="app-sidebar-drawer"
			[open]="sidebarOpen()"
			(closeRequested)="closeSidebar()"
		></app-sidebar>
		}
		<app-main></app-main>
	</div>
	<app-footer></app-footer>
</div>
